name: Release manual installers

# A reviewed request names one immutable commit. Publication requires the
# explicit publish boolean; omitting it prepares an unpublished draft.
on:
  push:
    branches: [main]
    paths: ['.github/release-request.json']
  workflow_dispatch:
    inputs:
      tag:
        description: Stable version tag (for example v0.1.0)
        required: true
        type: string
      source-sha:
        description: Exact 40-character main commit (leave empty only for an existing tag)
        required: false
        type: string
      publish:
        description: Publish after every source, installer, and uploaded checksum gate passes
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: manual-release
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
      version: ${{ steps.ref.outputs.version }}
      tag: ${{ steps.ref.outputs.tag }}
      publish: ${{ steps.ref.outputs.publish }}
      request-sha: ${{ steps.ref.outputs.request-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - id: ref
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SOURCE_SHA: ${{ inputs.source-sha }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
        run: node scripts/resolve-release-request.mjs

  build:
    needs: resolve
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      artifact-prefix: tangent-manual

  release:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: tangent-manual-*
          path: artifacts
      - name: Verify installers and publish only when explicitly requested
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_REQUEST_SHA: ${{ needs.resolve.outputs.request-sha }}
          RELEASE_ALLOW_TAG_CREATION: 'true'
          RELEASE_PUBLISH: ${{ needs.resolve.outputs.publish }}
        run: node scripts/create-draft-release.mjs manual
