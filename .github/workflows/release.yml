name: Build unsigned installers

# This workflow uploads review artifacts only. It does not publish a release.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - build/**
      - scripts/after-pack.cjs
      - scripts/check-packaged.mjs
      - .github/workflows/release.yml
      - .github/workflows/check.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
      artifact-prefix:
        required: false
        type: string
        default: tangent-unsigned

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  package:
    needs: verify
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
            command: npm run dist:mac -- --arm64 --publish never
          - os: macos-15-intel
            platform: macos-x64
            command: npm run dist:mac -- --x64 --publish never
          - os: ubuntu-22.04
            platform: linux-x64
            command: npm run dist:linux -- --x64 --publish never
          - os: windows-2025
            platform: windows-x64
            command: npm run dist:win -- --x64 --publish never
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      TANGENT_RELEASE_BUILD: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install Linux sandboxed desktop test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb libnss3 libgtk-3-0 libasound2
      - run: npm ci
      - run: node scripts/check-runtime.mjs --output runtime-versions.json
      - name: Build unsigned platform package
        env:
          # Permit the configured macOS identity "-" to reseal bundles ad hoc.
          # This PR job has no signing credentials; identity discovery is disabled.
          CSC_FOR_PULL_REQUEST: 'true'
        run: ${{ matrix.command }}
      - name: Smoke check delivered AppImage with Chromium sandbox enabled
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1440x1000x24 -nolisten tcp" node scripts/check-packaged.mjs --output packaged-smoke.json
      - name: Smoke check delivered macOS or Windows installers
        if: runner.os != 'Linux'
        run: node scripts/check-packaged.mjs --output packaged-smoke.json
      - name: Inventory manual installers
        env:
          RELEASE_SHA: ${{ inputs.ref || github.sha }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: node scripts/stage-release.mjs manual
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.artifact-prefix || 'tangent-unsigned' }}-${{ matrix.platform }}
          path: release-upload/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Retain packaged smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packaged-smoke-${{ matrix.platform }}
          path: |
            packaged-smoke.json
            test-results/
          if-no-files-found: ignore
          retention-days: 14
