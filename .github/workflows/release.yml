name: Build unsigned installers

# This workflow uploads review artifacts only. It does not publish a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
      artifact-prefix:
        required: false
        type: string
        default: tangent-unsigned

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  package:
    needs: verify
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
            command: npm run dist:mac -- --arm64 --publish never
          - os: macos-15-intel
            platform: macos-x64
            command: npm run dist:mac -- --x64 --publish never
          - os: ubuntu-24.04
            platform: linux-x64
            command: npm run dist:linux -- --x64 --publish never
          - os: windows-2025
            platform: windows-x64
            command: npm run dist:win -- --x64 --publish never
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      TANGENT_RELEASE_BUILD: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/check-runtime.mjs --output runtime-versions.json
      - name: Build unsigned platform package
        run: ${{ matrix.command }}
      - name: Inventory manual installers
        env:
          RELEASE_SHA: ${{ inputs.ref || github.sha }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: node scripts/stage-release.mjs manual
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.artifact-prefix || 'tangent-unsigned' }}-${{ matrix.platform }}
          path: release-upload/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
